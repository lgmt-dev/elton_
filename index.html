<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoje é Dia de Lanche!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 6.5rem);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>HOJE É DIA DE COMER LANCHE COM ELTON E FAMILIA</h1>
  </main>
</body>
</html>
